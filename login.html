<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Estilos/Estilos.css">
    <link rel="stylesheet" href="./Estilos/responsive.css">
</head>
<body>
    <main class="main-login">

    <div class="Contendor-login">
            <h1>Login</h1> 

            <div class="inputs">
                <input type="text" placeholder="Usuario" clasrequired id="Usuario">
                <i class="bxf bx-user"></i>
            </div>

             <div class="inputs">
                <input type="email" placeholder="Email" clasrequired id="email">
                <i class="bxf bx-envelope"></i>
            </div>

            <div class="inputs">
                <input type="password" placeholder="Contraseña" required id="Contraseña">
                <i class="bxf bx-lock-keyhole"></i>
            </div>
            
            <button class="btn-login" id="LoginButton">Enter</button>
    </div>
    </main>
    
     <script src="./JavaScript/login.js"></script>
</body>
</html
