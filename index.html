<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Estilos.css">
    <title>Document</title>
</head>

<body>
    <header class="contenidoheader">
        <div class="logo">
            <img src="" alt="">
            <span>Campus <em>Parking</em></span>
        </div>

        <div class="titulo">
            <h1>Sistema Integrado de Parqueo</h1>
        </div>

        <div></div>
    </header>

    <!-- Contenido main -->
    <main class="contenidomain">

        <!-- navbar -->
        <div class="contenidonav">
            <nav class="navbar">
                <ol>
                    <li>Dasboard</li>
                    <li>Gestion de parqueo
                        <ul>
                            <li>Operaciones</li>
                            <li>Estado de parqueo</li>
                        </ul>
                    </li>
                    <li>Clientes</li>
                </ol>

                <button class="BtnCerrrar">Cerrar Sesion</button>
            </nav>
        </div>

        <div class="contenedorMain">
            <div class="arriba">

                <!-- formulario de ingreso de vehiculo -->
                <div class="contendorblanco">
                    <h1>Ingreso de Vehiculo</h1>
                    <div class="formulario">
                        <label>Placa:</label>
                        <input type="text" />
                    </div>
                    <div class="formulario">
                        <label>Propietario:</label>
                        <input type="text" />
                    </div>
                    <div class="formulario">
                        <label>Teléfono:</label>
                        <input type="text" />
                    </div>
                    <div class="formulario">
                        <label>Tipo de Vehículo:</label>
                        <select>
                            <option>Carro</option>
                            <option>Moto</option>
                            <option>Bus</option>
                            <option>Camión</option>
                        </select>
                    </div>
                    <div class="formulario">
                        <label>Fecha de ingreso:</label>
                        <input type="datetime-local" />
                    </div>
                    <button class="btn-registrar">Registrar Vehículo</button>
                </div>

        </div>
    </main>
</body>

</html>
